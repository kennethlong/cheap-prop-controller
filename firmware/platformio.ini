[platformio]
default_envs = uno

[env]
platform = atmelavr@5.1.0
framework = arduino
monitor_speed = 115200
; Share AVR register-save sequences to retain the Pro Mini's 30 KB flash limit.
build_flags = -std=gnu++11 -Wall -Wextra -mcall-prologues

[env:uno]
board = uno
build_flags = ${env.build_flags} -DCPC_BOARD_ID=1

[env:nano]
board = nanoatmega328
build_flags = ${env.build_flags} -DCPC_BOARD_ID=2

[env:mega]
board = megaatmega2560
build_flags = ${env.build_flags} -DCPC_BOARD_ID=4

[env:promini]
board = pro16MHzatmega328
build_flags = ${env.build_flags} -DCPC_BOARD_ID=3
